/* Düzen: eski eczane reçete defteri — tek sütun kâğıt; formül masası solda, terazi ve sonuç sağda (dar ekranda alt alta) */
:root{
 --paper:#efe3c4;--paper2:#e4d3a8;--ink:#24160a;--ink2:#5a4326;--rule:#9a7a48;--accent:#7b2d1e;--moss:#4f6a2e;--warn:#a1621a;

}

:root[data-theme="dark"]{--paper:#211a12;--paper2:#18130d;--ink:#eadcbc;--ink2:#b9a37c;--rule:#7a6240;--accent:#d27a5f;--moss:#9cbf6a;--warn:#e0a35a;--zone:rgba(156,191,106,.22);--chip:#2b2218;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper2);color:var(--ink);font:16px/1.45 var(--fb);padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.sub{font-style:italic;color:var(--ink2)}

.lbl{font:12px var(--fu);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sheet{background:var(--paper);border:1px solid var(--rule);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--rule);padding:16px;display:grid;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--accent);color:var(--paper);border:1px solid var(--ink);padding:6px 12px;cursor:pointer;letter-spacing:.03em}

@media (max-width:560px){.note{grid-template-columns:1fr auto;row-gap:2px}.note .nm{grid-column:1/-1;overflow-wrap:normal}.note .fam{display:inline-block;margin-left:6px}.note .pm{min-width:36px;min-height:34px}}
.num{font:14px var(--fu);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.pm{width:28px;height:28px;border:1px solid var(--rule);background:var(--chip);cursor:pointer;line-height:1;padding:0}
.chipb{border:0;background:none;color:var(--accent);cursor:pointer;font-size:18px;padding:0 4px}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add select{flex:1 1 200px}
.npick{position:relative;flex:1 1 220px}.npb{width:100%;text-align:left;background:#fff!important;color:#000!important;border:1px solid #000!important}.nplist{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:2px;max-height:320px;overflow:auto;background:#fff;border:1px solid #000;border-radius:8px;padding:4px;box-shadow:0 4px 14px #0002}.npg{font-weight:800;font-size:12px;padding:6px 6px 2px;color:#555}.npo{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:#fff;border:0;border-bottom:1px solid #eee;padding:5px 6px;cursor:pointer;font:inherit;color:#000;text-align:left}.npo:hover{background:#f4f4f4}.npi{font-size:12px;white-space:nowrap}
.bal{display:grid;gap:10px}
.bar{position:relative;height:30px;border:1px solid var(--ink2);background:var(--chip)}
.bar .z{position:absolute;top:0;bottom:0;background:var(--zone);border-left:1px dashed var(--moss);border-right:1px dashed var(--moss)}
.bar .v{position:absolute;top:0;bottom:0;width:3px;background:var(--accent)}
.bar .t{position:absolute;top:0;bottom:0;width:2px;background:var(--moss)}
.bar .s{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--ink2) 22%,transparent)}
.ax{display:flex;justify-content:space-between;font:11px var(--fu);color:var(--ink2)}
.verdict{border:1px solid var(--rule);padding:12px;display:grid;gap:6px;background:var(--chip)}
.big{font:400 34px/1 var(--fd)}
.tier{font:400 22px var(--fd);color:var(--accent)}
.muted{color:var(--ink2);font-style:italic}
.log{display:grid;gap:4px;font-size:14.5px}
.log div{border-left:2px solid var(--rule);padding-left:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:3px 6px;border-bottom:1px dotted var(--rule);text-align:left}
th{font:11px var(--fu);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:400}
td.n,th.n{text-align:right;font-family:var(--fu);font-variant-numeric:tabular-nums}
.ok{color:var(--moss)}.bad{color:var(--accent)}
.scroll{overflow-x:auto}
.foot{font-size:13px;color:var(--ink2);text-align:center;font-style:italic}
.flask{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.pcard{border:1px solid var(--rule);background:var(--chip);padding:14px;box-shadow:inset 0 0 0 3px var(--chip),inset 0 0 0 4px var(--rule)}
.cf{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.cf{grid-template-columns:minmax(0,1fr)}.cflask{max-width:200px;margin:0 auto}}
.cinfo{display:grid;gap:8px;min-width:0}.cname{font-size:26px;overflow-wrap:anywhere}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}@media (max-width:420px){.meters{grid-template-columns:minmax(0,1fr)}}
.mt{display:grid;gap:3px}.mbar{height:8px;border:1px solid var(--ink2);background:var(--paper)}.mbar i{display:block;height:100%;background:var(--moss)}.mnote{font-size:12.5px;color:var(--ink2);font-style:italic}
.sea{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.sea div{border:1px solid var(--rule);padding:4px;text-align:center;display:grid;font-size:13px}.sea div.on{background:var(--ink);color:var(--paper)}.sea b{font-family:var(--fu);font-weight:400}
.cb{display:grid;gap:10px}.cols2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}@media (max-width:640px){.cols2{grid-template-columns:minmax(0,1fr)}}
.stk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stk div{border:1px solid var(--rule);padding:6px;display:grid;text-align:center}
.gph{border:1px dashed var(--rule);min-height:90px;padding:8px;display:grid;align-content:space-between}
.tabs{justify-self:center;flex-wrap:wrap}.rkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.rki{border:1px solid var(--rule);background:var(--chip);padding:6px;display:grid;gap:2px;font-size:14px;min-width:0}
td.n{white-space:nowrap}
.rki{cursor:pointer}.rki:hover,.rki[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent)}.rkb{display:grid;justify-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px}
.lcard{border:1px dashed var(--rule);padding:8px;display:grid;gap:4px;font-size:14.5px;align-content:start;min-width:0}.lcard.on{border-style:solid;background:var(--chip)}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badges span{border:1px solid var(--accent);color:var(--accent);padding:1px 8px;font-size:13.5px}.verdict.win{border:2px solid var(--moss)}
.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow select{min-width:0;width:100%}
.dsWrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}@media (max-width:520px){.dsWrap{grid-template-columns:minmax(0,1fr)}.dsPrev{justify-self:center}}
.dsPrev{background:var(--chip);border:1px solid var(--rule);padding:8px}.dsSel{display:grid;gap:6px;min-width:0}.dsSel label{display:grid;gap:2px}.dsSel select{width:100%;min-width:0}
.pm:disabled{opacity:.35;cursor:not-allowed}.dc{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:start}.dcb{display:grid;justify-items:center;background:var(--paper);border:1px solid var(--rule);padding:8px}.dcb svg{width:auto!important;height:190px!important;max-width:100%}@media (max-width:560px){.dc{grid-template-columns:minmax(0,1fr)}}
.kh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.kpts{border:1px solid var(--rule);padding:3px 8px;font:13px var(--fu);white-space:nowrap}.kpts.on{background:var(--accent);color:var(--paper)}
.ksk{display:grid;gap:3px;border-bottom:1px dotted var(--rule);padding:5px 0}
.sq{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.sqc{border:1px solid var(--rule);background:var(--chip);padding:8px;display:grid;gap:3px;align-content:start;font-size:13.5px;cursor:pointer;min-width:0;text-align:left;color:inherit;font-family:inherit}
.sqc:hover,.sqc[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent)}.sqc b{font-size:14.5px;overflow-wrap:anywhere}.sqb{display:grid;justify-items:center}
.hmc{border:1px solid var(--rule);background:var(--chip);padding:10px;display:grid;gap:5px;align-content:start;min-width:0;box-shadow:inset 0 0 0 3px var(--chip),inset 0 0 0 4px var(--rule)}.hmf{font-size:20px;line-height:1}.hmn{font-size:17px}
.dq{grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}.dq .sqc{font-size:14.5px;padding:10px;gap:4px}.dq .nums{font-size:13.5px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;font:12.5px var(--fu)}.nums span{display:flex;justify-content:space-between;gap:4px}.nums i{font-style:normal;color:var(--ink2)}
.corow{display:grid;grid-template-columns:repeat(5,minmax(132px,1fr));gap:8px;overflow-x:auto;padding:2px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.kcard{border:1px solid var(--rule);background:var(--chip);padding:10px;display:grid;gap:4px;align-content:start;min-width:0}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:14px;border-bottom:1px dotted var(--rule);padding:2px 0}.kcard .pm{width:26px;height:26px}
.fams{display:grid;gap:3px;font-size:14px}.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:6px}
details summary{cursor:pointer;font:12px var(--fu);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.fam{font:11px var(--fu);color:var(--ink2);margin-left:6px}
@media (prefers-reduced-motion:no-preference){.bar .v{transition:left .2s}}
/* Oyun sitesi: eski oyunun eskitme kâğıdı, üst menü, şirket şeridi, telefonda alt menü */
:root{--tabon:#cfb582;--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .22 0 0 0 0 .08 0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/></svg>");--mottle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .1 0 0 0 .55 -.22'/></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>");
 --c1:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='none' stroke='%238b6b3e' stroke-width='1.1'><path d='M2 22V9Q2 2 9 2h13'/><path d='M6 22V11Q6 6 11 6h11'/><circle cx='11' cy='11' r='2.2'/></g></svg>");--c2:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g transform='rotate(90 12 12)' fill='none' stroke='%238b6b3e' stroke-width='1.1'><path d='M2 22V9Q2 2 9 2h13'/><path d='M6 22V11Q6 6 11 6h11'/><circle cx='11' cy='11' r='2.2'/></g></svg>");--c3:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g transform='rotate(270 12 12)' fill='none' stroke='%238b6b3e' stroke-width='1.1'><path d='M2 22V9Q2 2 9 2h13'/><path d='M6 22V11Q6 6 11 6h11'/><circle cx='11' cy='11' r='2.2'/></g></svg>");--c4:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g transform='rotate(180 12 12)' fill='none' stroke='%238b6b3e' stroke-width='1.1'><path d='M2 22V9Q2 2 9 2h13'/><path d='M6 22V11Q6 6 11 6h11'/><circle cx='11' cy='11' r='2.2'/></g></svg>")}

:root[data-theme="dark"]{--tabon:#4a3a24}
body{background-color:var(--paper2);background-image:var(--noise),var(--mottle),radial-gradient(circle at 12% 22%,rgba(120,70,20,.14) 0 9px,transparent 10px),radial-gradient(circle at 78% 14%,rgba(120,70,20,.1) 0 6px,transparent 7px),radial-gradient(circle at 64% 71%,rgba(120,70,20,.11) 0 12px,transparent 13px),radial-gradient(ellipse at 85% 95%,rgba(110,75,30,.25),transparent 55%);background-attachment:fixed;padding-top:0}
.sheet{background-image:var(--c1),var(--c2),var(--c3),var(--c4),var(--noise);background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat;background-position:7px 7px,calc(100% - 7px) 7px,7px calc(100% - 7px),calc(100% - 7px) calc(100% - 7px),0 0;background-size:18px 18px,18px 18px,18px 18px,18px 18px,auto;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--rule),inset 0 0 40px rgba(90,55,20,.25),0 1px 3px rgba(60,35,10,.25);padding:18px 18px}
.pcard,.verdict{background-image:var(--noise)}
#nav{position:sticky;top:0;z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px;background-color:var(--paper2);background-image:var(--noise),linear-gradient(var(--paper),var(--paper2));border-bottom:3px double var(--rule);box-shadow:0 2px 8px rgba(60,35,10,.25);display:grid;gap:8px}
.topnav{max-width:1100px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font:400 26px/1 var(--fd);letter-spacing:.05em}
.menu{display:flex;flex-wrap:wrap;gap:6px}
.tabb{background:var(--paper);border:1px solid var(--rule);color:var(--ink);padding:6px 11px;cursor:pointer;font:15px var(--fb);border-radius:3px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px color-mix(in srgb,var(--rule) 40%,transparent)}
.tabb.on{background:var(--tabon);border-color:var(--ink2);box-shadow:inset 0 1px 3px rgba(60,35,10,.35)}
.tabb:focus-visible,.bbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;background:var(--accent);color:var(--paper);border-radius:99px;padding:0 6px;font:12px var(--fu)}

.strip .btn{padding:4px 10px}
#bnav{display:none}

/* Tema (2026-10-20): CEKO'nun örnek afişinden ölçülen renkler — sıcak krem kâğıt, kömür-kahve mürekkep, koyu başlık şeritleri */
:root{--paper:#f4e1bf;--paper2:#edd6b1;--chip:#f8e9cc;--ink:#272011;--ink2:#4f422a;--rule:#887657;--accent:#272011;--tabon:#272011;--moss:#3f5a24;
 --fd:'Cinzel','IM Fell English SC',Georgia,serif}
body{background-color:var(--paper2)}
h1,h2,.brand,.cname{font-family:var(--fd);font-weight:700;letter-spacing:.06em;color:var(--ink)}
h2{font-size:19px;text-transform:uppercase}
.brand{font-weight:800;font-size:28px;text-transform:uppercase}
.sheet{border:1.5px solid var(--ink2);border-radius:4px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--rule),0 1px 3px rgba(39,32,17,.2)}
.sheet>.spread:first-child>h2:first-child,.sheet>h2:first-child{background:var(--accent);color:var(--paper);padding:5px 18px 4px;border-radius:3px;font-size:15.5px;justify-self:start;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.btn{background:var(--accent);color:var(--paper);border:1px solid var(--accent);border-radius:3px}
.btn.ghost{background:var(--chip);color:var(--ink);border-color:var(--rule)}
.btn.ghost[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.tabb{border-radius:3px;font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.03em;border-color:var(--rule)}
.tabb.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.bbar button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}

  if(a.mol){const mi=p.findIndex(x=>isM(x.k)),ni=p.findIndex((x,i)=>i!==mi&&isN(x.k));if(mi>=0){m++;okk[mi]=1}if(ni>=0){m++;okk[ni]=1}}
  else p.forEach((x,i)=>{if(isN(x.k)&&!(i===1&&p[0].k===x.k)){m++;okk[i]=1}});
  const dev=m===2?p.reduce((t,x)=>t+Math.abs(x.d-akIdeal(x.k)),0):0,c={a,m,dev,okk,found:!!LAB.akor[a.id]},sc=c=>(c.found?-10:0)+c.m*10-(c.m===2?c.dev*.5:0);

 else{const w=UI.akr.s.map(x=>({nm:NB[x.k].tr,df:x.d-akIdeal(x.k)})).sort((x,y)=>Math.abs(y.df)-Math.abs(x.df))[0];r={t:"ratio",h:`${a.ic} İkisi uyuyor, oran tutmadı.`,sub:`Sapma ${b.dev} damla, en fazla ${akTol()} olabilir. ${w.nm} ${w.df>0?"fazla":"az"} geliyor.`}}
